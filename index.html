<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenova Study | JAMB Competition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #ffffff;
    color: #0B1F3A;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #05112A;
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 8px 16px;
    border-radius: 999px;
    margin-bottom: 28px;
  }
  .badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ffffff;
  }
  h1 {
    font-size: 28px;
    font-weight: 800;
    color: #0B1F3A;
    line-height: 1.3;
    margin-bottom: 14px;
  }
  h1 span {
    display: block;
    font-size: 15px;
    font-weight: 600;
    color: #6B7A99;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }
  p.sub {
    font-size: 16px;
    color: #3C4A66;
    line-height: 1.6;
    margin-bottom: 32px;
  }
  .divider {
    width: 60px;
    height: 4px;
    background: #0B1F3A;
    border-radius: 999px;
    margin: 0 auto 32px;
  }
  .footer-note {
    font-size: 13px;
    color: #93A0B8;
    font-weight: 500;
  }
  .btn {
    display: inline-block;
    background: #0B1F3A;
    color: #ffffff;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    padding: 14px 32px;
    border-radius: 10px;
    margin-bottom: 32px;
    transition: background 0.2s ease;
  }
  .btn:hover {
    background: #05112A;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge"><span class="dot"></span>Competition Closed</div>
    <h1>
      <span>Zenova Study JAMB Competition</span>
      First Edition Has Ended
    </h1>
    <div class="divider"></div>
    <p class="sub">Thank you to everyone who participated. Stay tuned to Zenova Study for updates on future editions and more ways to prepare for your exams.</p>
    <a href="https://zenovastudy.com.ng/competition/" class="btn">View Result</a>
    <div class="footer-note">Zenova Study &mdash; JAMB Competition</div>
  </div>
</body>
</html>
